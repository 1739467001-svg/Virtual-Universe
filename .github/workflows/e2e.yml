name: E2E 多端实测 (Playwright)

# 每次 push 与 PR 自动触发
on:
  push:
  pull_request:
  workflow_dispatch: # 也可在 Actions 页手动运行

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      - name: 安装 Chromium（含系统依赖）
        run: npx playwright install --with-deps chromium

      - name: 跑三端用例（电脑 / 平板 / 手机）
        run: npx playwright test

      # 无论成败都上传报告与截图，方便点开看
      - name: 上传测试报告 + 截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
