<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="基于 Three.js + WebXR 的太阳系模拟与漫游：真实贴图、自由飞行、语音导览、VR 沉浸，纯静态离线可用。" />
  <meta name="theme-color" content="#05060a" />
  <title>VR 太阳系漫游 · Solar System</title>
  <!-- 内联 SVG favicon（离线自带，避免请求 /favicon.ico 404）：一颗带环的行星 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='16' fill='%23ffcf6b'/%3E%3Cellipse cx='32' cy='32' rx='28' ry='9' fill='none' stroke='%23ffd27a' stroke-width='3' transform='rotate(-20 32 32)'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <!-- 加载提示 -->
  <div id="loading">正在构建太阳系…</div>

  <!-- 顶部标题 -->
  <header id="hud-top">
    <h1>🌌 太阳系漫游</h1>
    <p class="hint">鼠标左键拖拽旋转 · 滚轮缩放 · 右键平移 · 点击行星名飞过去</p>
    <p class="hint fly-hint hidden" id="fly-hint">🚀 自由飞行中：W/S 前后 · A/D 左右 · Q/E 升降 · Shift 加速 · 移动鼠标转向 · 滚轮调速 · ESC 退出</p>
  </header>

  <!-- 控制面板 -->
  <div id="controls">
    <button id="panel-collapse" title="收起 / 展开控制面板">－</button>
    <div class="row">
      <button id="play-toggle" title="暂停 / 继续">⏸ 暂停</button>
      <button id="reset-view" title="回到全景视角">🏠 全景</button>
      <button id="fly-toggle" title="自由飞行：以飞船视角在太阳系中漫游">🚀 自由飞行</button>
      <button id="ephemeris-align" title="把行星对齐到今天的真实角位置">📅 真实星历</button>
      <button id="tour-toggle" title="自动导览：依次飞向每颗行星并讲解">🎬 导览</button>
      <button id="music-toggle" title="背景音乐：太空氛围纯音乐" class="active">🎵 音乐</button>
      <button id="speed-collapse" title="展开 / 收起速度控制" aria-expanded="true">⏱ 速度 ▲</button>
    </div>
    <div id="speed-panel">
    <div class="row">
      <span class="label">公转</span>
      <input id="speed" type="range" min="0" max="500" value="5" />
      <span id="speed-val">5×</span>
      <span id="speed-presets">
        <button data-speed="0">0×</button>
        <button data-speed="1">1×</button>
        <button data-speed="2">2×</button>
        <button data-speed="5">5×</button>
        <button data-speed="10">10×</button>
        <button data-speed="20">20×</button>
        <button data-speed="50">50×</button>
      </span>
    </div>
    <div class="row">
      <span class="label">自转</span>
      <input id="spin" type="range" min="0" max="20" step="0.5" value="1" />
      <span id="spin-val">1×</span>
      <span id="spin-presets">
        <button data-spin="0">0×</button>
        <button data-spin="0.5">0.5×</button>
        <button data-spin="1">1×</button>
        <button data-spin="2">2×</button>
        <button data-spin="5">5×</button>
        <button data-spin="10">10×</button>
      </span>
    </div>
    </div>
    <div class="row">
      <label><input id="toggle-orbits" type="checkbox" checked /> 轨道线</label>
      <label><input id="toggle-labels" type="checkbox" checked /> 标签</label>
      <label><input id="toggle-voice" type="checkbox" checked /> 语音解说</label>
    </div>
    <div class="row">
      <span class="label">音乐</span>
      <input id="music-vol" type="range" min="0" max="100" value="60" />
      <span id="music-mood">
        <button data-mood="deep">🌌 深空</button>
        <button data-mood="default" class="active">🎵 默认</button>
        <button data-mood="travel">🚀 星际旅行</button>
      </span>
    </div>
    <div class="row" id="planet-jump"></div>
  </div>

  <!-- 信息卡片 -->
  <div id="info-card" class="hidden">
    <button id="info-close">×</button>
    <h2 id="info-name"></h2>
    <p id="info-desc"></p>
    <p id="info-live" class="hidden"></p>
    <ul id="info-stats"></ul>
  </div>

  <!-- 导览字幕 + 进度条 + 播放控制（屏幕底部,仅导览时显示）-->
  <div id="tour-bar" class="hidden">
    <div id="tour-progress">
      <div id="tour-ctrls">
        <button id="tour-prev" title="上一站">⏮</button>
        <button id="tour-pause" title="暂停 / 继续讲解">⏸</button>
        <button id="tour-next" title="下一站">⏭</button>
      </div>
      <span id="tour-step">第 1 / 9 站</span>
      <span id="tour-stop-name">太阳</span>
      <div id="tour-track"><div id="tour-fill"></div></div>
    </div>
    <p id="tour-subtitle"></p>
  </div>

  <!-- 飞行仪表盘 + 小地图雷达（右下角）-->
  <div id="flight-hud">
    <canvas id="radar" width="170" height="170"></canvas>
    <div id="hud-readout">
      <div class="hud-row"><span class="k">速度</span><span id="hud-speed">0</span></div>
      <div class="hud-row"><span class="k">坐标</span><span id="hud-pos">0, 0, 0</span></div>
      <div class="hud-row"><span class="k">最近</span><span id="hud-near">—</span></div>
    </div>
  </div>

  <!-- 移动端触屏摇杆（仅自由飞行时显示）：左摇杆平移 · 右侧拖拽转向 · 按钮升降/加速 -->
  <div id="touch-controls" class="hidden">
    <div id="joystick" title="平移">
      <div id="joystick-knob"></div>
    </div>
    <div id="fly-touch-btns">
      <button id="touch-boost" title="加速">🚀</button>
      <button id="touch-up" title="上升">▲</button>
      <button id="touch-down" title="下降">▼</button>
    </div>
  </div>

  <!-- Three.js 已打包进 vendor/（离线可用，无需联网、无需构建步骤）-->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
