<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VR 太阳系漫游 · Solar System</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <!-- 加载提示 -->
  <div id="loading">正在构建太阳系…</div>

  <!-- 顶部标题 -->
  <header id="hud-top">
    <h1>🌌 太阳系漫游</h1>
    <p class="hint">鼠标左键拖拽旋转 · 滚轮缩放 · 右键平移 · 点击行星名飞过去</p>
    <p class="hint fly-hint hidden" id="fly-hint">🚀 自由飞行中：W/S 前后 · A/D 左右 · Q/E 升降 · Shift 加速 · 移动鼠标转向 · 滚轮调速 · ESC 退出</p>
  </header>

  <!-- 控制面板 -->
  <div id="controls">
    <div class="row">
      <button id="play-toggle" title="暂停 / 继续">⏸ 暂停</button>
      <button id="reset-view" title="回到全景视角">🏠 全景</button>
      <button id="fly-toggle" title="自由飞行：以飞船视角在太阳系中漫游">🚀 自由飞行</button>
      <button id="ephemeris-align" title="把行星对齐到今天的真实角位置">📅 真实星历</button>
      <button id="tour-toggle" title="自动导览：依次飞向每颗行星并讲解">🎬 导览</button>
      <span class="label">速度</span>
      <input id="speed" type="range" min="0" max="500" value="5" />
      <span id="speed-val">5×</span>
      <span id="speed-presets">
        <button data-speed="1">1×</button>
        <button data-speed="2">2×</button>
        <button data-speed="5">5×</button>
        <button data-speed="10">10×</button>
        <button data-speed="20">20×</button>
        <button data-speed="50">50×</button>
      </span>
    </div>
    <div class="row">
      <label><input id="toggle-orbits" type="checkbox" checked /> 轨道线</label>
      <label><input id="toggle-labels" type="checkbox" checked /> 标签</label>
      <label><input id="toggle-voice" type="checkbox" checked /> 语音解说</label>
    </div>
    <div class="row" id="planet-jump"></div>
  </div>

  <!-- 信息卡片 -->
  <div id="info-card" class="hidden">
    <button id="info-close">×</button>
    <h2 id="info-name"></h2>
    <p id="info-desc"></p>
    <p id="info-live" class="hidden"></p>
    <ul id="info-stats"></ul>
  </div>

  <!-- 导览字幕 + 进度条 + 播放控制（屏幕底部,仅导览时显示）-->
  <div id="tour-bar" class="hidden">
    <div id="tour-progress">
      <div id="tour-ctrls">
        <button id="tour-prev" title="上一站">⏮</button>
        <button id="tour-pause" title="暂停 / 继续讲解">⏸</button>
        <button id="tour-next" title="下一站">⏭</button>
      </div>
      <span id="tour-step">第 1 / 9 站</span>
      <span id="tour-stop-name">太阳</span>
      <div id="tour-track"><div id="tour-fill"></div></div>
    </div>
    <p id="tour-subtitle"></p>
  </div>

  <!-- 飞行仪表盘 + 小地图雷达（右下角）-->
  <div id="flight-hud">
    <canvas id="radar" width="170" height="170"></canvas>
    <div id="hud-readout">
      <div class="hud-row"><span class="k">速度</span><span id="hud-speed">0</span></div>
      <div class="hud-row"><span class="k">坐标</span><span id="hud-pos">0, 0, 0</span></div>
      <div class="hud-row"><span class="k">最近</span><span id="hud-near">—</span></div>
    </div>
  </div>

  <!-- Three.js 已打包进 vendor/（离线可用，无需联网、无需构建步骤）-->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
